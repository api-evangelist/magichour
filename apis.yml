x-provenance:
  added: '2026-08-22'
  method: searched
  source: https://docs.magichour.ai/llms.txt
  note: >-
    Submitted via apis.io/add on 2026-08-22 from runbo@magichour.ai and auto-published by the gate
    at rating 15. THE SUBMITTED APIs.json URL IS WRONG: https://docs.magichour.ai/apis.json returns
    404, and an invented control path also 404s with a different body size, so the 404 is real
    rather than a catch-all. A bad pointer in the submission, not an absent surface.
    Everything here came from the provider's own llms.txt, which names the specification at
    /api-reference/openapi.json. That was fetched (501KB, OpenAPI 3.0.2) and is kept pristine under
    openapi/_original/. Note the spec declares zero component schemas despite 36 operations, so
    request and response shapes are inline rather than reusable.
    The API was probed: POST api.magichour.ai/v1/ai-headshot-generator returned 401 JSON, which is
    correct gating on a live host.
    Two DIFFERENT llms.txt files exist, one on magichour.ai and one on docs.magichour.ai. Both are
    kept; the docs one is the richer and is what this profile was built from.
