aid: magichour
name: Magic Hour
description: >-
  Magic Hour is an AI media generation platform for video, image and audio, exposed as a public
  REST API. The contract is an OpenAPI 3.0 document of 33 paths and 36 operations served from
  api.magichour.ai with bearer authentication, covering generators for headshots, clothes
  changing, face editing, GIFs, image editing and upscaling, plus video and audio synthesis.
  Operations are priced in credits and the documentation states the credit cost per call.
  Magic Hour publishes two llms.txt files — one on the marketing site and a different one on the
  docs host — plus a 653KB llms-full.txt, and documents an HMAC-SHA256 signed webhook surface
  with a full event-type reference.
