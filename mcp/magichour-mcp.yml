- name: ai_video_editor_create_video
  description: "MCP guidance:\n- Starts an async video job; returns `id` and `credits_charged`. For finished\
    \ results, call `wait_for_video_project` with that id or poll `GET /v1/video-projects/{id}` until\
    \ `complete`, `error`, or `canceled`. Results include `downloads`; wait helpers add `exact_download_urls`.\
    \ Preserve signed URLs and query parameters; never append expiration metadata.\n- For `*_file_path`,\
    \ use an existing Magic Hour path or the upload-URL endpoint's `file_path` after uploading raw bytes\
    \ to its presigned URL. Direct public media URLs may work if stable and fetchable as raw bytes; hotlinked\
    \ URLs can fail. Prefer the upload-URL endpoint when unsure.\n\n**What this API does**\n\nCreate the\
    \ same Video Editor you can make in the browser, but programmatically, so you can automate it, run\
    \ it at scale, or connect it to your own app or workflow.\n    \n**Good for**\n- Automation and batch\
    \ processing  \n- Adding video editor into apps, pipelines, or tools  \n\n**How it works (3 steps)**\n\
    1) Upload your inputs (video, image, or audio) with [Generate Upload URLs](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls)\
    \ and copy the `file_path`.  \n2) Send a request to create a video editor job with the basic fields.\
    \  \n3) Check the job status until it's `complete`, then download the result from `downloads`.\n\n\
    **Key options**\n- Inputs: usually a file, sometimes a YouTube link, depending on project type  \n\
    - Resolution: free users are limited to 576px; higher plans unlock HD and larger sizes  \n- Extra\
    \ fields: e.g. `face_swap_mode`, `start_seconds`/`end_seconds`, or a text prompt  \n\n**Cost**  \n\
    Credits are only charged for the frames that actually render. You'll see an estimate when the job\
    \ is queued, and the final total after it's done.\n\nFor detailed examples, see the [product page](https://magichour.ai/products/ai-video-editor)."
