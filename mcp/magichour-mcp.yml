tools:
- name: workflow_guide_retrieve
  description: Read Magic Hour workflow guidance for face swap, image editing, image-to-video, video generation,
    lip sync, UGC ads, talking photos or API integration. Returns product and documentation URLs, exact
    tool names, ordered steps, example requests, follow-up edits and review criteria; does not generate
    media, spend credits or check account access.
- name: ping
  description: Check that the Magic Hour MCP server is reachable.
- name: wait_for_video_project
  description: Poll a video project until it completes, errors, is canceled, or times out. After a timeout,
    resume with the same id; do not create another generation. Returns sanitized download fields. Use
    `exact_download_urls[n]` or `downloads[n].url` exactly as returned; do not shorten it, remove query
    parameters, or append expiration metadata. Inline previews share an 8 MiB limit; all download URLs
    remain available.
- name: wait_for_image_project
  description: Poll an image project until it completes, errors, is canceled, or times out. After a timeout,
    resume with the same id; do not create another generation. Returns the final project JSON and, when
    complete, attempts to inline image downloads for Inspector or compatible clients. Returns sanitized
    download fields. Use `exact_download_urls[n]` or `downloads[n].url` exactly as returned; do not shorten
    it, remove query parameters, or append expiration metadata. Inline previews share an 8 MiB limit;
    all download URLs remain available.
- name: wait_for_audio_project
  description: Poll an audio project until it completes, errors, is canceled, or times out. After a timeout,
    resume with the same id; do not create another generation. Returns the final project JSON and, when
    complete, attempts to inline audio downloads for Inspector or compatible clients. Returns sanitized
    download fields. Use `exact_download_urls[n]` or `downloads[n].url` exactly as returned; do not shorten
    it, remove query parameters, or append expiration metadata. Inline previews share an 8 MiB limit;
    all download URLs remain available.
- name: fetch_image_download
  description: Fetch a image `downloads[n].url` from a completed image project and return it as inline
    MCP image content for compatible clients. Pass the exact full signed URL from `downloads[n].url` without
    trimming query parameters; `expires_at` is separate metadata, not part of the URL. Inline media is
    capped at 8 MiB; use the signed URL directly for larger downloads.
- name: fetch_audio_download
  description: Fetch a audio `downloads[n].url` from a completed audio project and return it as inline
    MCP audio content for compatible clients. Pass the exact full signed URL from `downloads[n].url` without
    trimming query parameters; `expires_at` is separate metadata, not part of the URL. Inline media is
    capped at 8 MiB; use the signed URL directly for larger downloads.
- name: fetch_video_download
  description: Fetch a video `downloads[n].url` from a completed video project and return it as an embedded
    MCP binary resource for compatible clients. Pass the exact full signed URL from `downloads[n].url`
    without trimming query parameters; `expires_at` is separate metadata, not part of the URL. Inline
    media is capped at 8 MiB; use the signed URL directly for larger downloads.
- name: account_retrieve
  description: Get the current credit balance and subscription details of the account that owns the API
    key.
- name: saved_items_list
  description: Returns active saved items owned by the authenticated account, newest first. Each item
    includes every saved asset with a durable file_path for reuse in compatible generation APIs and a
    temporary signed URL for previewing or downloading. Filter by type to find characters, references,
    voices, moodboards, or brand kits. To fetch the next page, pass the response's next_cursor as cursor.
- name: video_assets_generate_presigned_url
  description: "MCP guidance:\n- This only creates presigned upload URLs. For local files, upload the\
    \ raw bytes to each returned `upload_url` outside the generation call, then pass the matching `file_path`\
    \ into the create tool.\n- For `*_file_path`, use an existing Magic Hour path or the upload-URL endpoint's\
    \ `file_path` after uploading raw bytes to its presigned URL. Direct public media URLs may work if\
    \ stable and fetchable as raw bytes; hotlinked URLs can fail. Prefer the upload-URL endpoint when\
    \ unsure.\n\nGenerates a list of pre-signed upload URLs for the assets required. This API is only\
    \ necessary if you want to upload to Magic Hour's storage. Refer to the [Input Files Guide](https://docs.magichour.ai/integration/inputs-and-outputs)\
    \ for more details.\n\nThe response array will match the order of items in the request body.\n\n**Valid\
    \ file extensions per asset type**:\n- video: mp4, m4v, mov, webm\n- audio: mp3, wav, aac, flac, webm,\
    \ weba, m4a, opus, ogg, oga, aiff, amr\n- image: png, jpg, jpeg, jfif, heic, heif, webp, avif, jp2,\
    \ tiff, tif, bmp\n- gif: gif, webp, webm\n\n> Note: `gif` is only supported for face swap API `video_file_path`\
    \ field.\n\nOnce you receive an upload URL, send a `PUT` request to upload the file directly.\n\n\
    Example:\n\n```\ncurl -X PUT --data '@/path/to/file/video.mp4' \\\n  https://videos.magichour.ai/api-assets/id/video.mp4?<auth\
    \ params from the API response>\n```"
- name: face_detection_retrieve_details
  description: "Get the details of a face detection task. \n\nUse this API to get the list of faces detected\
    \ in the image or video to use in the [face swap photo](https://docs.magichour.ai/api-reference/image-projects/face-swap-photo)\
    \ or [face swap video](https://docs.magichour.ai/api-reference/video-projects/face-swap-video) API\
    \ calls for multi-face swaps."
- name: face_detection_detect_faces
  description: "MCP guidance:\n- This starts an async face-detection task and returns an `id`. Use the\
    \ face-detection details endpoint with that id to retrieve detected faces before doing individual\
    \ face swaps.\n- For `*_file_path`, use an existing Magic Hour path or the upload-URL endpoint's `file_path`\
    \ after uploading raw bytes to its presigned URL. Direct public media URLs may work if stable and\
    \ fetchable as raw bytes; hotlinked URLs can fail. Prefer the upload-URL endpoint when unsure.\n\n\
    Detect faces in an image or video. \n      \nUse this API to get the list of faces detected in the\
    \ image or video to use in the [face swap photo](https://docs.magichour.ai/api-reference/image-projects/face-swap-photo)\
    \ or [face swap video](https://docs.magichour.ai/api-reference/video-projects/face-swap-video) API\
    \ calls for multi-face swaps.\n\nNote: Face detection is free to use for the near future. Pricing\
    \ may change in the future."
- name: video_projects_retrieve_details
  description: "MCP guidance:\n- Use this after a create tool to poll job status. When status is `complete`,\
    \ surface the `downloads` URLs to the user; if status is `error`, surface the error message.\n- Each\
    \ `downloads[n].url` is already the full signed download URL. Use it exactly as returned. Do not shorten\
    \ it, strip query parameters, or append `expires_at` onto the URL string.\n\nCheck the progress of\
    \ a video project. The `downloads` field is populated after a successful render.\n  \n**Statuses**\n\
    - `queued` — waiting to start\n- `rendering` — in progress\n- `complete` — ready; see `downloads`\n\
    - `error` — a failure occurred (see `error`)\n- `canceled` — user canceled\n- `draft` — not used"
- name: video_projects_delete
