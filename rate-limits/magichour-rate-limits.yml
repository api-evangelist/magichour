response_signaling:
  status_code: 429
  headers: []
  note: 429 Too Many Requests is documented with retry-with-exponential-backoff guidance, but no X-RateLimit-*,
    RateLimit-* or Retry-After response headers are documented. 402 signals credit exhaustion and 403 signals a
    plan-gated model/resolution — both act as spend guards distinct from throttling.
note: The published throttle model is plan-tier concurrency on generation jobs rather than requests-per-window;
  no per-second/minute request quota is documented.
