  /v1/face-swap:
    post:
      description: "**What this API does**\n\nCreate the same Face Swap you can make in the browser, but programmatically, so you can automate it, run it at scale, or connect it to your own app or workflow.\n    \n**Good for**\n- Automation and batch processing  \n- Adding face swap into apps, pipelines, or tools  \n\n**How it works (3 steps)**\n1) Upload your inputs (video, image, or audio) with [Generate Upload URLs](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls) and copy the `file_path`.  \n2) Send a request to create a face swap job with the basic fields.  \n3) Check the job status until it's `complete`, then download the result from `downloads`.\n\n**Key options**\n- Inputs: see the request schema for endpoint-specific assets  \n- Resolution: free users default to 480p; higher plans unlock HD and larger sizes  \n- Extra fields: see the request schema for endpoint-specific options  \n\n**Cost**  \nCredits are only charged for the frames that actually render. You'll see an estimate when the job is queued, and the final total after it's done.\n\nFor detailed examples, see the [product page](https://magichour.ai/products/face-swap)."
      summary: Face Swap Video
      tags:
      - Video Projects
      parameters: []
      operationId: faceSwap.createVideo
      requestBody:
        required: true
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Give your video a custom name for easy identification.
                  example: My Face Swap video
                  default: Face Swap - dateTime
                start_seconds:
                  type: number
                  minimum: 0
                  description: Start time of your clip (seconds). Must be ≥ 0.
                  format: float
                  example: 0
                end_seconds:
                  type: number
                  minimum: 0.1
                  description: End time of your clip (seconds). Must be greater than start_seconds.
                  format: float
                  example: 15
                style:
                  type: object
                  properties:
                    version:
                      type: string
                      enum:
                      - v1
                      - v2
                      - default
                      example: default
                      description: '* `v1` - May preserve skin detail and texture better, but weaker identity preservation.

                        * `v2` - Faster, sharper, better handling of hair and glasses. stronger identity preservation.

                        * `default` - Use the version we recommend, which will change over time. This is recommended unless you need a specific earlier version. This is the default behavior.'
                  description: Style of the face swap video.
                  example:
                    version: default
                assets:
                  type: object
                  properties:
                    face_swap_mode:
                      default: all-faces
                      type: string
                      enum:
                      - all-faces
                      - individual-faces
                      description: 'Choose how to swap faces:

                        **all-faces** (recommended) — swap all detected faces using one source image (`source_file_path` required)

                        +- **individual-faces** — specify exact mappings using `face_mappings`'
                      example: all-faces
                    image_file_path:
                      type: string
                      description: 'The path of the input image with the face to be swapped.  The value is required if `face_swap_mode` is `all-faces`.


                        This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        '
                      example: image/id/1234.png
                    face_mappings:
                      type: array
                      items:
                        type: object
                        properties:
                          original_face:
                            type: string
                            description: 'The face detected from the image in `target_file_path`. The file name is in the format of `<face_frame>-<face_index>.png`. This value is corresponds to the response in the [face detection API](https://docs.magichour.ai/api-reference/files/get-face-detection-details).


                              * The face_frame is the frame number of the face in the target image. For images, the frame number is always 0.

                              * The face_index is the index of the face in the target image, starting from 0 going left to right.'
                            example: api-assets/id/0-0.png
                          new_face:
                            type: string
                            description: 'The face image that will be used to replace the face in the `original_face`. This value is either

                              - a direct URL to the video file

                              - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                              See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                              '
                            example: api-assets/id/1234.png
                        required:
                        - original_face
                        - new_face
                      maxItems: 5
                      description: This is the array of face mappings used for multiple face swap. The value is required if `face_swap_mode` is `individual-faces`.
                      example:
                      - original_face: api-assets/id/0-0.png
                        new_face: api-assets/id/1234.png
                    video_source:
                      type: string
                      enum:
                      - file
                      - youtube
                      description: Choose your video source.
                      example: file
                    video_file_path:
                      type: string
                      description: 'Your video file. Required if `video_source` is `file`. This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        '
                      example: api-assets/id/1234.mp4
                    youtube_url:
                      type: string
                      format: uri
                      description: YouTube URL (required if `video_source` is `youtube`).
                  required:
                  - video_source
                  description: Provide the assets for face swap. For video, The `video_source` field determines whether `video_file_path` or `youtube_url` field is used
              required:
              - start_seconds
              - end_seconds
              - assets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: cuid-example
                    description: Unique ID of the video. Use it with the [Get video Project API](https://docs.magichour.ai/api-reference/video-projects/get-video-details) to fetch status and downloads.
                  credits_charged:
                    type: integer
                    description: "The amount of credits deducted from your account to generate the video. If the status is not 'complete', this value is an estimate and may be adjusted upon completion based on the actual FPS of the output video. \n\nIf video generation fails, credits will be refunded, and this field will be updated to include the refund."
                    example: 450
                required:
                - id
                - credits_charged
                description: Success
        '400':
