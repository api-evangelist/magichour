  /v1/video-to-video:
    post:
      description: "**What this API does**\n\nCreate the same Video To Video you can make in the browser, but programmatically, so you can automate it, run it at scale, or connect it to your own app or workflow.\n    \n**Good for**\n- Automation and batch processing  \n- Adding video to video into apps, pipelines, or tools  \n\n**How it works (3 steps)**\n1) Upload your inputs (video, image, or audio) with [Generate Upload URLs](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls) and copy the `file_path`.  \n2) Send a request to create a video to video job with the basic fields.  \n3) Check the job status until it's `complete`, then download the result from `downloads`.\n\n**Key options**\n- Inputs: see the request schema for endpoint-specific assets  \n- Resolution: free users default to 480p; higher plans unlock HD and larger sizes  \n- Extra fields: see the request schema for endpoint-specific options  \n\n**Cost**  \nCredits are only charged for the frames that actually render. You'll see an estimate when the job is queued, and the final total after it's done.\n\nFor detailed examples, see the [product page](https://magichour.ai/products/video-to-video)."
      summary: Video-to-Video
      tags:
      - Video Projects
      parameters: []
      operationId: videoToVideo.createVideo
      requestBody:
        required: true
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Give your video a custom name for easy identification.
                  example: My Video To Video video
                  default: Video To Video - dateTime
                start_seconds:
                  type: number
                  minimum: 0
                  description: Start time of your clip (seconds). Must be ≥ 0.
                  format: float
                  example: 0
                end_seconds:
                  type: number
                  minimum: 0.1
                  description: End time of your clip (seconds). Must be greater than start_seconds.
                  format: float
                  example: 15
                fps_resolution:
                  default: HALF
                  type: string
                  enum:
                  - FULL
                  - HALF
                  description: 'Determines whether the resulting video will have the same frame per second as the original video, or half.

                    * `FULL` - the result video will have the same FPS as the input video

                    * `HALF` - the result video will have half the FPS as the input video'
                  example: HALF
                style:
                  type: object
                  properties:
                    art_style:
                      type: string
                      enum:
                      - Minecraft
                      - Watercolor
                      - Pixel
                      - Retro Sci-Fi
                      - Lego
                      - Origami
                      - Ghost
                      - Sub-Zero
                      - Studio Ghibli
                      - Comic
                      - Impressionism
                      - Master Chief
                      - Solid Snake
                      - Street Fighter
                      - Hologram
                      - GTA
                      - Clay
                      - Mystique
                      - Dragonball Z
                      - Mario
                      - Samurai
                      - Spartan
                      - Boba Fett
                      - 3D Render
                      - Airbender
                      - Android
                      - Anime Warrior
                      - Armored Knight
                      - Assassin's Creed
                      - Avatar
                      - Black Spiderman
                      - Bold Anime
                      - Celestial Skin
                      - Chinese Swordsmen
                      - Cyberpunk
                      - Cypher
                      - Dark Fantasy
                      - Future Bot
                      - Futuristic Fantasy
                      - Ghibli Anime
                      - Gundam
                      - Illustration
                      - Ink
                      - Ink Poster
                      - Jinx
                      - Knight
                      - Link
                      - Marble
                      - Mech
                      - Naruto
                      - Neon Dream
                      - No Art Style
                      - Oil Painting
                      - On Fire
                      - Painterly Anime
                      - Pixar
                      - Power Armor
                      - Power Ranger
                      - Radiant Anime
                      - Realistic Anime
                      - Realistic Pixar
                      - Retro Anime
                      - Samurai Bot
                      - Sharp Anime
                      - Soft Anime
                      - Starfield
                      - The Void
                      - Tomb Raider
                      - Underwater
                      - Van Gogh
                      - Viking
                      - Western Anime
                      - Wu Kong
                      - Wuxia Anime
                      - Zelda
                    version:
                      default: default
                      type: string
                      enum:
                      - v1
                      - v2
                      - default
                      example: default
                      description: '* `v1` - more detail, closer prompt adherence, and frame-by-frame previews.

                        * `v2` - faster, more consistent, and less noisy.

                        * `default` - use the default version for the selected art style.'
                    prompt_type:
                      default: default
                      type: string
                      enum:
                      - default
                      - custom
                      - append_default
                      example: default
                      description: '* `default` - Use the default recommended prompt for the art style.

                        * `custom` - Only use the prompt passed in the API. Note: for v1, lora prompt will still be auto added to apply the art style properly.

                        * `append_default` - Add the default recommended prompt to the end of the prompt passed in the API.'
                    prompt:
                      type:
                      - string
                      - 'null'
                      description: The prompt used for the video. Prompt is required if `prompt_type` is `custom` or `append_default`. If `prompt_type` is `default`, then the `prompt` value passed will be ignored.
                    model:
                      default: default
                      type: string
                      enum:
                      - Dreamshaper
                      - Absolute Reality
                      - Flat 2D Anime
                      - Soft Anime
                      - Kaywaii
                      - Western Anime
                      - 3D Anime
                      - default
                      example: default
                      description: '* `Dreamshaper` - a good all-around model that works for both animations as well as realism.

                        * `Absolute Reality` - better at realism, but you''ll often get similar results with Dreamshaper as well.

                        * `Flat 2D Anime` - best for a flat illustration style that''s common in most anime.

                        * `default` - use the default recommended model for the selected art style.'
                  required:
                  - art_style
                assets:
                  type: object
                  properties:
                    video_source:
                      type: string
                      enum:
                      - file
                      - youtube
                      description: Choose your video source.
                      example: file
                    video_file_path:
                      type: string
                      description: 'Your video file. Required if `video_source` is `file`. This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        '
                      example: api-assets/id/1234.mp4
                    youtube_url:
                      type: string
                      format: uri
                      description: YouTube URL (required if `video_source` is `youtube`).
                  required:
                  - video_source
                  description: Provide the assets for video-to-video. For video, The `video_source` field determines whether `video_file_path` or `youtube_url` field is used
              required:
              - start_seconds
              - end_seconds
              - style
              - assets
