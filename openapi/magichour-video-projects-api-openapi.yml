  /v1/character-replace:
    post:
      description: "**What this API does**\n\nCreate the same Character Replace you can make in the browser, but programmatically, so you can automate it, run it at scale, or connect it to your own app or workflow.\n    \n**Good for**\n- Automation and batch processing  \n- Adding character replace into apps, pipelines, or tools  \n\n**How it works (3 steps)**\n1) Upload your inputs (video, image, or audio) with [Generate Upload URLs](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls) and copy the `file_path`.  \n2) Send a request to create a character replace job with the basic fields.  \n3) Check the job status until it's `complete`, then download the result from `downloads`.\n\n**Key options**\n- Inputs: see the request schema for endpoint-specific assets  \n- Resolution: free users default to 480p; higher plans unlock HD and larger sizes  \n- Extra fields: see the request schema for endpoint-specific options  \n\n**Cost**  \nCredits are only charged for the frames that actually render. You'll see an estimate when the job is queued, and the final total after it's done.\n\nFor detailed examples, see the [product page](https://magichour.ai/products/character-replace)."
      summary: Character Replace
      tags:
      - Video Projects
      parameters: []
      operationId: characterReplace.createVideo
      requestBody:
        required: true
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Give your video a custom name for easy identification.
                  example: My Character Replace video
                  default: Character Replace - dateTime
                start_seconds:
                  default: 0
                  type: number
                  minimum: 0
                  description: Start time of your clip (seconds). Must be ≥ 0.
                  format: float
                  example: 0
                end_seconds:
                  type: number
                  minimum: 0.1
                  description: End time of your clip (seconds). Must be greater than start_seconds.
                  format: float
                  example: 15
                resolution:
                  type: string
                  enum:
                  - 480p
                  - 720p
                  description: Output video resolution. Defaults to 480p, the lowest resolution available on your plan.
                  example: 720p
                assets:
                  type: object
                  properties:
                    video_file_path:
                      type: string
                      minLength: 1
                      description: 'Source video containing the subject to replace or animate. This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        '
                      example: api-assets/id/1234.mp4
                    image_file_path:
                      type: string
                      minLength: 1
                      description: 'Reference character image used as the replacement or animation target. This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        '
                      example: api-assets/id/5678.png
                  required:
                  - video_file_path
                  - image_file_path
                  description: Source video and reference character image for the job.
                style:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - replace
                      - animate
                      description: Processing mode. `replace` swaps the detected subject with your reference character. `animate` transfers motion from the video onto your character image.
                      example: replace
                    selection_mode:
                      type: string
                      enum:
                      - auto
                      - point
                      description: How to locate the subject in the source video. `auto` detects a person automatically. `point` uses your `points` to mark the subject. Defaults to `auto`.
                      example: auto
                    points:
                      type: array
                      items:
                        type: object
                        properties:
                          position_x:
                            type: integer
                            minimum: 0
                            description: Horizontal pixel coordinate in the source video frame at `time_seconds`, measured from the left edge.
                            example: 320
                          position_y:
                            type: integer
                            minimum: 0
                            description: Vertical pixel coordinate in the source video frame at `time_seconds`, measured from the top edge.
                            example: 180
                          time_seconds:
                            type: number
                            minimum: 0
                            description: Timestamp on the source video timeline in seconds. Uses the same clock as `start_seconds` and `end_seconds`.
                            format: float
                            example: 2.5
                        required:
                        - position_x
                        - position_y
                        - time_seconds
                      description: On-frame markers for manual subject selection. Required when `selection_mode` is `point`. Ignored when `selection_mode` is `auto` or omitted.
                  description: Optional style controls for replace vs animate mode and subject selection.
                  example:
                    mode: replace
                    selection_mode: auto
              required:
              - end_seconds
              - assets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: cuid-example
                    description: Unique ID of the video. Use it with the [Get video Project API](https://docs.magichour.ai/api-reference/video-projects/get-video-details) to fetch status and downloads.
                  credits_charged:
                    type: integer
                    description: "The amount of credits deducted from your account to generate the video. If the status is not 'complete', this value is an estimate and may be adjusted upon completion based on the actual FPS of the output video. \n\nIf video generation fails, credits will be refunded, and this field will be updated to include the refund."
                    example: 450
                required:
                - id
                - credits_charged
                description: Success
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
                description: The request is invalid
                example:
                  message: Missing request body
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Unauthorized
                required:
                - message
                description: The request is not properly authenticated
                example:
                  message: Unauthorized
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
                description: The request requires payment
                example:
                  message: Payment required
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Not Found
                required:
                - message
                description: Requested resource is not found
                example:
                  message: Not Found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unable to create video
                required:
                - message
                description: Unprocessable Entity
