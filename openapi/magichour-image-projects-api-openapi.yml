  /v1/ai-image-editor:
    post:
      description: Edit images with AI.
      summary: AI Image Editor
      tags:
      - Image Projects
      parameters: []
      operationId: aiImageEditor.createImage
      requestBody:
        required: true
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Give your image a custom name for easy identification.
                  example: My Ai Image Editor image
                  default: Ai Image Editor - dateTime
                image_count:
                  type: number
                  enum:
                  - 1
                  - 4
                  - 9
                  - 16
                  description: Number of images to generate. Maximum varies by model. Defaults to 1 if not specified.
                  example: 1
                  default: 1
                model:
                  type: string
                  enum:
                  - default
                  - nano-banana-2
                  - gpt-image-2
                  - flux-2-klein
                  - nano-banana-2-lite
                  - qwen-edit
                  - seedream-v4
                  - seedream-v4.5
                  - seedream-v5-pro
                  - nano-banana
                  - nano-banana-pro
                  description: "The AI model to use for image editing. Each model has different capabilities and costs.\n\n**Models:**\n- `default` - Use the model we recommend, which will change over time. This is recommended unless you need a specific model. This is the default behavior.\n- `flux-2-klein` - from 5 credits/image\n  - Supported resolutions: 640px, 1k, 2k\n  - Available for tiers: free, creator, pro, business\n  - Max additional input images: 5\n- `gpt-image-2` - from 50 credits/image\n  - Supported resolutions: 640px, 1k, 2k, 4k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n- `nano-banana` - from 50 credits/image\n  - Supported resolutions: 640px, 1k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n- `nano-banana-2` - from 100 credits/image\n  - Supported resolutions: 640px, 1k, 2k, 4k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n- `nano-banana-2-lite` - from 50 credits/image\n  - Supported resolutions: 640px, 1k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n- `nano-banana-pro` - from 150 credits/image\n  - Supported resolutions: 1k, 2k, 4k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n- `qwen-edit` - from 10 credits/image\n  - Supported resolutions: 640px, 1k, 2k\n  - Available for tiers: free, creator, pro, business\n  - Max additional input images: 2\n- `seedream-v4` - from 40 credits/image\n  - Supported resolutions: 640px, 1k, 2k, 4k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n- `seedream-v4.5` - from 50 credits/image\n  - Supported resolutions: 640px, 1k, 2k, 4k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n- `seedream-v5-pro` - from 75 credits/image\n  - Supported resolutions: 640px, 1k, 2k\n  - Available for tiers: creator, pro, business\n  - Max additional input images: 9\n"
                  example: default
                aspect_ratio:
                  type: string
                  enum:
                  - auto
                  - '16:9'
                  - '9:16'
                  - '4:3'
                  - '3:2'
                  - '1:1'
                  - '4:5'
                  - '2:3'
                  description: The aspect ratio of the output image(s). If not specified, defaults to `auto`.
                  example: '1:1'
                resolution:
                  type: string
                  enum:
                  - auto
                  - 640px
                  - 1k
                  - 2k
                  - 4k
                  description: 'Maximum resolution (longest edge) for the output image.


                    **Options:**

                    - `640px` — up to 640px

                    - `1k` — up to 1024px

                    - `2k` — up to 2048px

                    - `4k` — up to 4096px

                    - `auto` — **Deprecated.** Mapped server-side from your subscription tier to the best matching resolution the model supports


                    **Per-model support:**

                    - `flux-2-klein` - 640px, 1k, 2k

                    - `gpt-image-2` - 640px, 1k, 2k, 4k

                    - `nano-banana` - 640px, 1k

                    - `nano-banana-2` - 640px, 1k, 2k, 4k

                    - `nano-banana-2-lite` - 640px, 1k

                    - `nano-banana-pro` - 1k, 2k, 4k

                    - `qwen-edit` - 640px, 1k, 2k

                    - `seedream-v4` - 640px, 1k, 2k, 4k

                    - `seedream-v4.5` - 640px, 1k, 2k, 4k

                    - `seedream-v5-pro` - 640px, 1k, 2k


                    Note: Resolution availability depends on the model and your subscription tier.'
                  example: 1k
                style:
                  type: object
                  properties:
                    prompt:
                      type: string
                      minLength: 1
                      maxLength: 15000
                      description: The prompt used to edit the image.
                      example: Give me sunglasses
                  required:
                  - prompt
                assets:
                  type: object
                  properties:
                    image_file_paths:
                      type: array
                      items:
                        type: string
                        minLength: 1
                      maxItems: 10
