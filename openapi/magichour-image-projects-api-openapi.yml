  /v1/ai-image-upscaler:
    post:
      description: Upscale your image using AI. Each 2x upscale costs 50 credits for balanced/creative modes, and 25 credits for preserve. 4x upscale costs 200 and 100 credits respectively.
      summary: AI Image Upscaler
      tags:
      - Image Projects
      parameters: []
      operationId: aiImageUpscaler.createImage
      requestBody:
        required: true
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Give your image a custom name for easy identification.
                  example: My Image Upscaler image
                  default: Image Upscaler - dateTime
                scale_factor:
                  type: number
                  example: 2
                  description: "How much to scale the image. Must be either 2 or 4.\n            \nNote: 4x upscale is only available on Creator, Pro, or Business tier."
                style:
                  default: {}
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - pro
                      - preserve
                      - balanced
                      - creative
                      description: The upscaling mode. `"preserve"` uses the fast pro pipeline (1× credit multiplier). `"balanced"` and `"creative"` use the creative pipeline (2× credit multiplier). `"pro"` is deprecated and maps to `"preserve"`. Defaults to `"balanced"`.
                      example: balanced
                    prompt:
                      type: string
                      description: A prompt to guide the final image. Only used when mode is `creative`.
                  description: Style settings for the upscale. Use `mode` (`"preserve"`, `"balanced"`, or `"creative"`). Defaults to `"balanced"`.
                assets:
                  type: object
                  properties:
                    image_file_path:
                      type: string
                      minLength: 1
                      description: 'The image to upscale. This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        . The maximum input image size is 4096x4096px.'
                      example: api-assets/id/1234.png
                  required:
                  - image_file_path
                  description: Provide the assets for upscaling
              required:
              - scale_factor
              - assets
