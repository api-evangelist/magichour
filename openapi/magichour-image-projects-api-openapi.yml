  /v1/face-swap-photo:
    post:
      description: Create a face swap photo. Each photo costs 10 credits. The height/width of the output image depends on your subscription. Please refer to our [pricing](https://magichour.ai/pricing) page for more details
      summary: Face Swap Photo
      tags:
      - Image Projects
      parameters: []
      operationId: faceSwapPhoto.createImage
      requestBody:
        required: true
        description: Body
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Give your image a custom name for easy identification.
                  example: My Face Swap image
                  default: Face Swap - dateTime
                assets:
                  type: object
                  properties:
                    face_swap_mode:
                      default: all-faces
                      type: string
                      enum:
                      - all-faces
                      - individual-faces
                      description: 'Choose how to swap faces:

                        **all-faces** (recommended) — swap all detected faces using one source image (`source_file_path` required)

                        +- **individual-faces** — specify exact mappings using `face_mappings`'
                      example: all-faces
                    source_file_path:
                      type: string
                      minLength: 1
                      description: 'This is the image from which the face is extracted. The value is required if `face_swap_mode` is `all-faces`.


                        This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        '
                      example: api-assets/id/1234.png
                    face_mappings:
                      type: array
                      items:
                        type: object
                        properties:
                          original_face:
                            type: string
                            description: 'The face detected from the image in `target_file_path`. The file name is in the format of `<face_frame>-<face_index>.png`. This value is corresponds to the response in the [face detection API](https://docs.magichour.ai/api-reference/files/get-face-detection-details).


                              * The face_frame is the frame number of the face in the target image. For images, the frame number is always 0.

                              * The face_index is the index of the face in the target image, starting from 0 going left to right.'
                            example: api-assets/id/0-0.png
                          new_face:
                            type: string
                            description: 'The face image that will be used to replace the face in the `original_face`. This value is either

                              - a direct URL to the video file

                              - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                              See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                              '
                            example: api-assets/id/1234.png
                        required:
                        - original_face
                        - new_face
                      maxItems: 5
                      description: This is the array of face mappings used for multiple face swap. The value is required if `face_swap_mode` is `individual-faces`.
                      example:
                      - original_face: api-assets/id/0-0.png
                        new_face: api-assets/id/1234.png
                    target_file_path:
                      type: string
                      minLength: 1
                      description: 'This is the image where the face from the source image will be placed. This value is either

                        - a direct URL to the video file

                        - `file_path` field from the response of the [upload urls API](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls).


                        See the [file upload guide](https://docs.magichour.ai/api-reference/files/generate-asset-upload-urls#input-file) for details.

                        '
                      example: api-assets/id/1234.png
                  required:
                  - target_file_path
                  description: Provide the assets for face swap photo
              required:
              - assets
